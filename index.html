<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registre de recouvrement — Skoonize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sheet">

  <header class="letterhead">
    <div class="letterhead-top">
      <span class="wordmark">Skoonize</span>
      <span class="doc-type">Registre de recouvrement</span>
    </div>
    <div class="letterhead-sub">
      <span id="school-name">École partenaire</span>
      <span class="sep">·</span>
      <span id="annee-scolaire">Année scolaire</span>
    </div>
    <div class="rule-double"></div>
  </header>

  <section class="hero">
    <p class="hero-label">Reste à recouvrer sur l'année écoulée</p>
    <h1 id="hero-amount">—</h1>
    <svg class="squiggle" viewBox="0 0 220 12" preserveAspectRatio="none"><path d="M2 8 Q 20 2, 38 8 T 74 8 T 110 8 T 146 8 T 182 8 T 218 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    <p class="hero-sub" id="hero-sub">—</p>
  </section>

  <section class="ledger-summary" id="stats">
    <!-- injected -->
  </section>

  <section class="controls">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Chercher un nom…" autocomplete="off">
      <span class="search-underline"></span>
    </div>
    <div class="filters">
      <select id="filter-niveau">
        <option value="">Tous niveaux</option>
        <option value="Primaire">Primaire</option>
        <option value="Secondaire">Secondaire</option>
      </select>
      <select id="filter-classe">
        <option value="">Toutes classes</option>
      </select>
      <select id="filter-statut">
        <option value="">Tous statuts</option>
        <option value="Non Soldée">Doivent encore</option>
        <option value="Soldée">Soldés</option>
      </select>
    </div>
  </section>

  <section class="register">
    <div id="student-list"></div>
    <p id="empty-state" class="empty-state" hidden>Aucun élève ne correspond à cette recherche.</p>
  </section>

  <footer class="colophon">
    <span>Enregistré uniquement sur cet appareil.</span>
    <button id="reset-btn">Réinitialiser les paiements saisis</button>
  </footer>

</div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
